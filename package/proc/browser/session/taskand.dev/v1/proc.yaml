uri: proc://taskand.dev/browser/session/v1
interface:
  stdin: urn:taskand:schema:browser-command:v1
  stdout: urn:taskand:schema:browser-session:v1
  exit: { 0: ok, 1: fail-closed, 2: kontrakt }
runtimes:
  - kind: node
    bin: bin.mjs
    engines: ">=20"
  - kind: docker
    image: "mcr.microsoft.com/playwright:v1.48@sha256:7f9202"
    capabilities: [cookies, screenshots, pdf, dom]
  - kind: remote
    via: "wss://browserbase.taskand"
    capabilities: [cookies, screenshots, dom]
session:
  scheme: "session://browser/<id>"
  lifecycle: "start -> navigate -> stop"
  credential: { via: broker, purposeScoped: true, neverInJson: true }
grants: { run: [start-session], observe: [read-session-status] }
